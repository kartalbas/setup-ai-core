name: check
# A push of a branch and a pull request; a tag names a commit whose checks already ran on the branch
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/check.sh
        shell: bash
      # The one check that reaches github.com: every GraphQL mutation of the board commands
      # against the schema GitHub publishes. Both twins, with the workflow's own token.
      - run: bash bin/schema-check.sh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pwsh -NoProfile -File bin/schema-check.ps1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
